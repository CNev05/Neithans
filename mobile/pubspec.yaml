name: neithans
description: neithans — offline-first rent notifier
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.0.0
  google_sign_in: ^6.2.1
  provider: ^6.1.1
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  workmanager: ^0.9.0
  background_fetch: ^1.3.0
  http: ^1.2.0
  fl_chart: ^0.66.0
  connectivity_plus: ^5.0.2
  path: ^1.9.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  intl: ^0.19.0
  image_cropper: ^8.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
